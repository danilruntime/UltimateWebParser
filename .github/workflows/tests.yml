name: tests

# The unit suite needs no network and no browser: `integration` and `live` are
# skipped without UWP_TEST_BROWSER / UWP_LIVE, so this runs in seconds on a bare
# runner. It has been measured to pass with no `.env` present and with no system
# libraries beyond a stock Python image — `doctor`'s probe of Playwright's
# bundled Node is stubbed in the tests that are not about it.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # ``requires-python = ">=3.12"`` and the image builds on 3.12; 3.14 is
        # what the project is developed on. Testing both ends catches a
        # forward-reference or a removed stdlib alias early.
        python-version: ["3.12", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install the package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check src tests

      # ruff does not read shell scripts, so a syntax error in the release script
      # would first surface on a machine that was about to tag a release.
      - name: The shell scripts parse
        run: |
          for script in scripts/*.sh; do
            bash -n "$script" && echo "ok $script"
          done

      - name: Test
        run: pytest

      # `test_packaging.py` reads pyproject.toml, but only a built wheel proves
      # what a resolver will see. Measured: placing `[project.urls]` above
      # `dependencies` left the list inside the URL table — valid TOML, clean
      # ruff, 620 green tests, and a wheel with zero runtime requirements.
      - name: The wheel carries its runtime dependencies
        run: |
          python -m pip wheel . --no-deps -w /tmp/wheel -q
          python - <<'PY'
          import glob, zipfile

          wheel = glob.glob("/tmp/wheel/*.whl")[0]
          with zipfile.ZipFile(wheel) as archive:
              metadata = next(
                  archive.read(name).decode()
                  for name in archive.namelist()
                  if name.endswith("METADATA")
              )

          runtime = [
              line for line in metadata.splitlines()
              if line.startswith("Requires-Dist:") and "extra ==" not in line
          ]
          for expected in ("playwright", "aiogram", "odfpy", "aiosqlite", "cryptography"):
              assert any(expected in line.lower() for line in runtime), (
                  f"{expected} is missing from Requires-Dist: {runtime}"
              )
          print(f"{len(runtime)} runtime requirements in the wheel")
          PY

      # A documentation change is not covered by pytest when it is a broken
      # relative link, so check that every tracked markdown file's local links
      # resolve. The scan lives in a script because a quoted README template
      # inside a ``` fence is not a link — reading it as one reddened `main`
      # from 2026-11-22 (`docs/superpowers/plans/2026-11-22-…`, commit b41656d;
      # `v0.1b3` was clean). Fenced and inline
      # code are stripped before the check, and `tests/unit/test_markdown_links.py`
      # pins both directions so a future edit cannot turn it into a no-op.
      - name: Markdown links resolve
        run: python scripts/check_markdown_links.py

  # Split mode is the documented deployment; a compose edit that breaks the port
  # band or the seccomp mount is caught by tests, but only a real `config`
  # invocation proves the two files still merge.
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: The split stack still merges
        run: |
          docker compose -f compose.split.yaml -f compose.split.hostnet.yaml config -q
