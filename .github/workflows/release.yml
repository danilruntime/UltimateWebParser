name: release

# A release is a tag, and a tag is cheap to get wrong: `git tag v0.2 b1` or a
# tag pushed before the version bump both create a page that claims something
# the files do not. So the tag is checked against `pyproject.toml` before
# anything is published, and the archives are built from the tagged commit — a
# release that cannot be built is not a release.
on:
  push:
    tags: ["v*"]
  # A published release can be wrong in a way the tag cannot show: the notes
  # file was edited after the tag, or the page lacks `--prerelease`. Re-running
  # for an existing tag updates it instead of failing, so a fix to the notes
  # does not require deleting and re-creating a tag that others may have fetched.
  #
  # Run this **from `main`**, not from the tag: a tag created before this trigger
  # existed has no `workflow_dispatch` in its copy of the file, and GitHub
  # refuses with "Workflow does not exist or does not have a workflow_dispatch
  # trigger in this tag". The code still comes from the tag via `checkout ref:`.
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to create or update, e.g. v0.1b1 (run from main, not from the tag)"
        required: true

permissions:
  contents: write

env:
  # One name for both triggers: a pushed tag arrives in the ref, a manual run
  # gets it from the input. Everything below reads this and nothing else, so a
  # manual run cannot accidentally test or package `main`.
  RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # `ref:` is what makes a manual run honest: without it the checkout would
      # be the default branch, and the release would test code the tag does not
      # contain.
      #
      # `fetch-depth: 0` is for the notes, not the history: notes are read from
      # the *triggering* commit (see below), which for a dispatch is `main` and
      # is therefore not an ancestor of the tag. A shallow clone would not have
      # it, and the run would silently fall back to the tag's older notes.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      # Installed before the tag is validated because `packaging` is a
      # transitive dependency here, not a declared one; importing it first would
      # rely on whatever a stock runner happens to ship.
      - name: Install the package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # `v0.1b1` -> `0.1b1`. Anything PEP 440 rejects (a space, a stray `v`) is
      # not a version pip can install, so it is not a release here either.
      - name: The tag names the version in pyproject.toml
        run: |
          python - <<'PY'
          import os
          import sys
          import tomllib
          from pathlib import Path

          from packaging.version import InvalidVersion, Version

          tag = os.environ["RELEASE_TAG"]
          declared = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]

          try:
              tagged = Version(tag.removeprefix("v"))
          except InvalidVersion:
              sys.exit(f"tag {tag!r} is not a PEP 440 version")

          if tagged != Version(declared):
              sys.exit(f"tag {tag} names {tagged}, pyproject.toml says {declared}")

          print(f"releasing {tagged}")
          PY

      # The tag carries the notes as they were when it was cut. A manual run is
      # usually a *repair* of those notes, so the published text is taken from
      # the commit that started the run: `GITHUB_SHA` is the tag on a tag push
      # and the selected branch on a dispatch. Reading the file from the checked
      # out tree instead would silently republish the stale text the repair was
      # meant to replace — measured: the tag says «631 тест», `main` does not.
      - name: Read the notes from the triggering commit
        run: |
          if ! git show "$GITHUB_SHA:docs/releases/$RELEASE_TAG.md" > "$RUNNER_TEMP/notes.md"; then
            echo "docs/releases/$RELEASE_TAG.md does not exist at $GITHUB_SHA ($RELEASE_TAG)" >&2
            echo "add it, push, then run this workflow again" >&2
            exit 1
          fi
          if [ ! -s "$RUNNER_TEMP/notes.md" ]; then
            echo "docs/releases/$RELEASE_TAG.md is empty at $GITHUB_SHA" >&2
            exit 1
          fi
          wc -c "$RUNNER_TEMP/notes.md"

      # The suite must pass on the exact commit being released, not on the tip
      # of `main`: a tag can point at an older commit than the last green run.
      - name: Test
        run: pytest

      # Building is a check, not a deliverable. Measured: putting
      # `[project.urls]` above `dependencies` left the list inside the URL
      # table — valid TOML, clean ruff, green suite, and a wheel whose
      # `Requires-Dist` held zero runtime requirements. Only a built wheel
      # shows what a resolver sees, so it is still built here — into a temp
      # directory, because nothing is attached to the release any more.
      - name: The wheel builds and carries its runtime dependencies
        run: |
          pip install build
          python -m build --wheel --outdir "$RUNNER_TEMP/dist"
          python - <<'PY'
          import glob
          import os
          import zipfile

          wheel = glob.glob(os.environ["RUNNER_TEMP"] + "/dist/*.whl")[0]
          with zipfile.ZipFile(wheel) as archive:
              metadata = next(
                  archive.read(name).decode()
                  for name in archive.namelist()
                  if name.endswith("METADATA")
              )

          runtime = [
              line for line in metadata.splitlines()
              if line.startswith("Requires-Dist:") and "extra ==" not in line
          ]
          for expected in ("playwright", "aiogram", "odfpy", "aiosqlite", "cryptography"):
              assert any(expected in line.lower() for line in runtime), (
                  f"{expected} is missing from Requires-Dist: {runtime}"
              )
          print(f"{len(runtime)} runtime requirements in the wheel")
          PY

      # A 0.x beta is not "Latest": GitHub puts that badge on the newest
      # non-prerelease, and a beta wearing it reads as a stable recommendation.
      # The `--prerelease` flag already keeps it away, but a repair of a page
      # that was *published* before the flag existed still holds the badge, so
      # `--latest=false` is stated for that case.
      #
      # It is not stated for a stable release. Measured with a stub `gh`:
      # passing it unconditionally made every stable release `--latest=false`,
      # i.e. the badge would never appear at all, and the repository would keep
      # advertising an old beta as the current version. The flag is bound to
      # `is_prerelease`, which is the same condition that sets `--prerelease`.
      #
      # No archives are attached. A wheel of this project holds `uwp/` and the
      # dist-info only — no compose file, no Dockerfile, no seccomp profile —
      # so a reader who installed it would have a CLI and no way to start the
      # service. Publishing an artifact that reads as an install path is worse
      # than publishing none; `git clone` plus compose is the documented one.
      #
      # `v0.1b1` was published with two assets before this decision. The first
      # argument to `delete-asset` is the tag and the second the asset name, so
      # a blanket removal cannot be written; only the names this project
      # produced are listed, and a missing one is not an error.
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerel=""
          latest=""
          if python -c "import sys; from packaging.version import Version; sys.exit(0 if Version('$RELEASE_TAG'.removeprefix('v')).is_prerelease else 1)"; then
            prerel="--prerelease"
            latest="--latest=false"
          fi

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "release $RELEASE_TAG exists, updating it"
            gh release edit "$RELEASE_TAG" \
              --title "$RELEASE_TAG" \
              --notes-file "$RUNNER_TEMP/notes.md" \
              $latest \
              $prerel
            for asset in "ultimate_web_parser-${RELEASE_TAG#v}-py3-none-any.whl" \
                         "ultimate_web_parser-${RELEASE_TAG#v}.tar.gz"; do
              gh release delete-asset "$RELEASE_TAG" "$asset" --yes \
                || echo "no asset $asset to remove"
            done
          else
            gh release create "$RELEASE_TAG" \
              --title "$RELEASE_TAG" \
              --notes-file "$RUNNER_TEMP/notes.md" \
              --verify-tag \
              $latest \
              $prerel
          fi
