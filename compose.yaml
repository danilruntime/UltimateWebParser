# Combined deployment: the bot and the worker in one container.
# Copy to ``.env`` and fill in the token and admin ids.
services:
  uwp:
    build: .
    image: ultimate-web-parser:latest
    container_name: uwp
    restart: unless-stopped
    env_file:
      # Optional: ``docker compose up`` works with plain ``-e`` flags too.
      - path: .env
        required: false
    environment:
      UWP_DATA_DIR: /data
    volumes:
      - ./data:/data:z
    shm_size: 1gb
    ports:
      - "6000-6100:6000-6100"
    healthcheck:
      # Through the entrypoint: the check must run as uid 1000, not root.
      # --offline: the proxy probe crosses a third-party proxy, and its
      # slowness must not mark a working container unhealthy.
      test: ["CMD", "/entrypoint.sh", "doctor", "--offline", "--quiet"]
      interval: 60s
      timeout: 30s
      start_period: 30s
      retries: 3
