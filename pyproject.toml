[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ultimate-web-parser"
version = "0.1.0"
description = "UltimateWebParser: Playwright-based site scraper controlled by a Telegram bot"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
authors = [{ name = "danilruntime" }]
keywords = [
    "scraping",
    "playwright",
    "telegram-bot",
    "libreoffice",
    "odf",
    "self-hosted",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: No Input/Output (Daemon)",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP :: Browsers",
    "Topic :: Office/Business :: Financial :: Spreadsheet",
]

[project.urls]
Homepage = "https://github.com/danilruntime/UltimateWebParser"
Repository = "https://github.com/danilruntime/UltimateWebParser"
Issues = "https://github.com/danilruntime/UltimateWebParser/issues"
Changelog = "https://github.com/danilruntime/UltimateWebParser/commits/main"
dependencies = [
    "playwright>=1.55",
    "aiogram>=3.20",
    "aiohttp-socks>=0.9",
    "aiosqlite>=0.21",
    "odfpy>=1.4",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "beautifulsoup4>=4.12",
    "cryptography>=43",
    "tzdata",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.6",
    "pyyaml>=6",
]

[project.scripts]
uwp = "uwp.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/uwp"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "live: hits the real internet",
    "integration: needs a browser",
]
addopts = "-q"
