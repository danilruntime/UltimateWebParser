[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ultimate-web-parser"
version = "0.1.0"
description = "UltimateWebParser: Playwright-based site scraper controlled by a Telegram bot"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
dependencies = [
    "playwright>=1.55",
    "aiogram>=3.20",
    "aiosqlite>=0.21",
    "odfpy>=1.4",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "beautifulsoup4>=4.12",
    "cryptography>=43",
    "tzdata",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.6",
]

[project.scripts]
uwp = "uwp.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/uwp"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "live: hits the real internet",
    "integration: needs a browser",
]
addopts = "-q"
