# Split deployment: the bot polls Telegram, the worker owns the browser and VNC.
# Both share ./data (SQLite in WAL mode).
services:
  bot:
    build: .
    image: ultimate-web-parser:latest
    container_name: uwp-bot
    command: ["bot"]
    restart: unless-stopped
    env_file:
      # Optional: ``docker compose up`` works with plain ``-e`` flags too.
      - path: .env
        required: false
    environment:
      UWP_DATA_DIR: /data
    volumes:
      - ./data:/data:z
    depends_on:
      - worker
    healthcheck:
      # Through the entrypoint: the check must run as uid 1000, not root.
      # --offline: the proxy probe crosses a third-party proxy, and its
      # slowness must not mark a working container unhealthy.
      test: ["CMD", "/entrypoint.sh", "doctor", "--offline", "--quiet"]
      interval: 60s
      timeout: 30s
      start_period: 30s
      retries: 3

  worker:
    build: .
    image: ultimate-web-parser:latest
    container_name: uwp-worker
    command: ["worker"]
    restart: unless-stopped
    env_file:
      # Optional: ``docker compose up`` works with plain ``-e`` flags too.
      - path: .env
        required: false
    environment:
      UWP_DATA_DIR: /data
    volumes:
      - ./data:/data:z
    # Chromium builds its sandbox from user namespaces, which Docker's stock
    # seccomp profile refuses. This profile relaxes exactly the three rules that
    # block it; see docker/README-seccomp.md.
    security_opt:
      - seccomp=./docker/seccomp-uwp.json
    shm_size: 1gb
    # noVNC is plain HTTP with an 8-character password: publishing the band on
    # 0.0.0.0 puts an unencrypted desktop on every host interface. Loopback by
    # default; a remote admin tunnels over SSH or fronts it with TLS.
    ports:
      - "127.0.0.1:6000-6100:6000-6100"
    healthcheck:
      # Through the entrypoint: the check must run as uid 1000, not root.
      # --offline: the proxy probe crosses a third-party proxy, and its
      # slowness must not mark a working container unhealthy.
      test: ["CMD", "/entrypoint.sh", "doctor", "--offline", "--quiet"]
      interval: 60s
      timeout: 30s
      start_period: 30s
      retries: 3
